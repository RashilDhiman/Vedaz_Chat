services:
  - type: web
    name: vedaz-chat
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/chat.db
    disk:
      name: vedaz-chat-data
      mountPath: /var/data
      sizeGB: 1
